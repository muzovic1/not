name: Deploy Vite App from Zip

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project zip
        run: |
          mkdir -p extracted
          unzip -o notlarim-defter.zip -d extracted

      - name: Find and build project
        run: |
          # package.json dosyasının nerede olduğunu otomatik bulur
          PROJECT_DIR=$(dirname $(find extracted -name "package.json" -quit))
          echo "Proje dizini bulundu: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          npm install
          npm run build
          # Derlenen dist klasörünü pages'e hazırlamak için taşıyoruz
          mkdir -p ../../final_dist
          cp -r dist/* ../../final_dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './final_dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
