name: Deploy Vite App from Zip

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract and Locate Project
        run: |
          mkdir -p extracted
          unzip -o notlarim-defter.zip -d extracted
          
          # Zip içerisindeki package.json'ın olduğu klasörü bulup oraya geçiyoruz
          PKG_PATH=$(find extracted -name "package.json" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PKG_PATH" >> $GITHUB_ENV

      - name: Install dependencies and build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '${{ env.PROJECT_DIR }}/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
